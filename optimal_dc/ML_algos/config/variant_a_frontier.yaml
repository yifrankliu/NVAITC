# Variant A: Frontier CSV only + regime-A synthetic
#
# Ablation baseline: what's achievable with current pipeline
# Data: 16h real Frontier + regime-A synthetic for data augmentation
# Objective: establish single-cluster baseline

# Inherit defaults
inherit: "default.yaml"

# Variant-specific overrides
variant: "a_frontier_only"
description: "Frontier CSV (real, 1 day) + regime-A synthetic (extended)"

# Data sources
data_sources:
  - type: "frontier_csv"
    path: "optimal_dc/external/sustain-lc/input_04-07-24.csv"
    split: [0.67, 0.33]  # 16h train, 8h eval
  - type: "regime_a_synthetic"
    config_path: "optimal_dc/workload_gen/spec/regime_A_calib.json"
    n_synthetic_days: 2  # extend training with regime-A

stacking: "regime_a_synthetic"

# Network tuning (can experiment)
hidden_sizes: [256, 256]
learning_rate: 3.0e-4

# Training specifics
n_total_steps: 500_000  # shorter for variant A

# Checkpoints will be saved to:
# optimal_dc/ML_algos/checkpoints/variant_a/ppo_frontier_seed0/
