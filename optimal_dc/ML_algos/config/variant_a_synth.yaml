# Variant A-synth: TRAIN ON SYNTHETIC regime-A days, hold the real day for eval.
#
# The train-on-synthetic / test-on-real protocol (2026-08-28 decision): every
# episode reset draws a FRESH certified regime-A day (generate -> trace-tier
# rejection-sample -> /9 disaggregate), so the policy trains on the workload
# DISTRIBUTION and the real 2024-04-07 trajectory stays unseen until the
# pre-committed evaluation. (Since the 2026-08-30 full-day protocol below,
# every episode starts at midnight — the start offset is forced to 0.)
#
# Train with:  python -m optimal_dc.ML_algos.benchmarks train --algo ma_ca_ppo \
#                --config optimal_dc/ML_algos/config/variant_a_synth.yaml ...

variant: "a_synth"
description: "Synthetic regime-A days (fresh certified day per episode), v3 /9; real day held out for eval"

seed: 0
use_reward_shaping: "reward_shaping_v2"
# NOTE: this is the FAITHFUL arm — gamma stays at upstream's 0.80 (via
# SUSTAINLC_DEFAULTS) on purpose. The energy arm raises it to 0.99; see
# variant_a_synth_energy.yaml for the rationale.

# --- FULL-DAY EPISODES (2026-08-30 decision) ---------------------------------
# One certified day = one episode: 5760 steps x 15 s = 24 h, started at
# midnight (benchmarks passes min_horizon = max_ep_len, which forces the day
# sampler's start offset to 0), FMU reset once per day. Rationale: the plant
# reaches developed thermal states (the 50-min protocol trained ONLY on
# cold-start windows); cold-start bias drops from 100% to ~4% of data; training
# now matches rollout.py's full-day evaluation protocol.
# update_ep_len decouples the PPO cadence from episode length: updates every
# FACTOR x 192 steps (MA/unified 192, MH 384). 192 was chosen as the closest
# value to upstream's 200 that divides 5760 — so every episode end is an
# update boundary (buffers empty) and the resume snapshot fires exactly once
# per simulated day. NOTE: a 500k-step run now covers ~86 full days (plus one
# final partial episode) instead of ~2500 partial ones — fuller days, fewer.
max_ep_len: 5760
update_ep_len: 192

# csv_path only feeds the env constructor's discarded generator; the sampler
# below replaces the exogenous stream at every reset.
csv_path: "optimal_dc/external/sustain-lc/input_04-07-24.csv"
disaggregator_version: "v3"

# Per-reset synthetic day source (kwargs for ML_algos.data_loader.RegimeADaySampler).
# wetbulb "replay" = the real day's facility wet-bulb column; swap in a pool of
# "noaa:YYYY-MM-DD" entries to add the seasonal axis.
synthetic_day_sampler:
  # 2000 = start of the reserved TRAINING seed range [2000, 1e6). Seeds 0-31
  # are calibration CRN (in-sample), 1000-1039 gate, >= 1e6 eval delivery —
  # see workload_gen_pipeline/__init__.py (seed partition, 2026-08-30).
  seed: 2000
  wetbulb: "replay"
  require_pass: true
  # Same daily-mean band as the delivered eval traces (deliver.py --mean-band):
  # train and eval days now come from the SAME conditional distribution
  # ("band both" decision, 2026-08-30).
  mean_band_MW: [15.0, 17.3]
