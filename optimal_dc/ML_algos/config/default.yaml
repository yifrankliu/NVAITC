# Default configuration for the sustain-lc baseline algorithms
# (ma_ca_ppo / mh_ma_ca_ppo — pick with `benchmarks train --algo ...`).
#
# Any key here overrides the sustain-lc upstream defaults hardcoded in
# sustainlc_baselines.SUSTAINLC_DEFAULTS; omitted keys fall back to the exact
# upstream train-script values, which are listed below for reference.

seed: 0
device: "cuda"  # informational; the sustain-lc nets pick cuda themselves if available

# --- sustain-lc PPO hyperparameters (defaults shown = upstream values) ---
# max_ep_len: 200            # timesteps per episode
# update_timestep: 200       # MA: 1 x ep_len; MH default: 2 x ep_len
# K_epochs: 50               # epochs per PPO update
# eps_clip: 0.2
# gamma: 0.80
# lr_actor: 3.0e-4
# lr_critic: 1.0e-3
# action_std_init: 0.6       # decays by 0.05 every 250k steps to 0.1
# save_model_freq: 2000      # best-reward checkpoint cadence (steps)

# --- environment ---
use_reward_shaping: "reward_shaping_v2"   # what both upstream baselines trained with
# NOTE: the FMU path is not configurable — the env loads the FMU sitting next
# to frontier_env.py in external/sustain-lc/ (LC_Frontier_5Cabinet_4_17_25.fmu)

# --- data pipeline (read by benchmarks.py; relative to repo root NVAITC/) ---
csv_path: "optimal_dc/external/sustain-lc/input_04-07-24.csv"
disaggregator_version: "v3"
