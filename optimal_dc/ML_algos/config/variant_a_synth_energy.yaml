# Variant A-synth-energy: train on synthetic days, ENERGY reward.
#
# The second comparison arm (2026-08-29 decision): same three architectures,
# same synthetic-day training distribution as variant_a_synth.yaml, but the
# agents optimize the TRUE objective during training instead of the sustain-lc
# temperature/valve proxies:
#
#     r_t = -(P_cooling / P_ref) - lambda * max(0, T_cab_max - T_MAX_K)
#
# Arms are separate RUNS -- an agent never sees two reward functions. Native
# arm = "baselines as published"; this arm = "best effort on our objective".
# Everything is SCORED on the same rollout.py energy metric either way.
#
# Train with:  python -m optimal_dc.ML_algos.benchmarks train --algo ma_ca_ppo \
#                --config optimal_dc/ML_algos/config/variant_a_synth_energy.yaml ...

variant: "a_synth_energy"
description: "Synthetic regime-A days, facility_energy reward (true objective); real day held out for eval"

seed: 0
use_reward_shaping: "facility_energy"

# Best-effort arm: gamma raised from the upstream 0.80 (2026-08-30 decision).
# 0.80 gives a 1/(1-gamma) = 5-step (75 s) credit horizon — pre-cooling ahead
# of load/weather (the mechanism this energy objective exists to reward) is
# invisible at that horizon. 0.99 -> ~100-step (25 min) horizon, matching the
# plant's thermal-inertia timescale. The NATIVE arm (variant_a_synth.yaml)
# deliberately keeps upstream 0.80 — that arm is "baselines as published".
gamma: 0.99

# Full-day episodes + decoupled PPO cadence — same protocol as
# variant_a_synth.yaml (see the block there for the full rationale).
# The facility_energy warmup mask (first 30 post-reset steps) now applies
# once per day instead of once per 50 min.
max_ep_len: 5760
update_ep_len: 192

csv_path: "optimal_dc/external/sustain-lc/input_04-07-24.csv"
disaggregator_version: "v3"

synthetic_day_sampler:
  # 2000 = start of the reserved TRAINING seed range [2000, 1e6). Seeds 0-31
  # are calibration CRN (in-sample), 1000-1039 gate, >= 1e6 eval delivery —
  # see workload_gen_pipeline/__init__.py (seed partition, 2026-08-30).
  seed: 2000
  wetbulb: "replay"
  require_pass: true
  # Same daily-mean band as the delivered eval traces (deliver.py --mean-band):
  # train and eval days now come from the SAME conditional distribution
  # ("band both" decision, 2026-08-30).
  mean_band_MW: [15.0, 17.3]

# facility_energy constants -- defaults are the /9-regime values measured
# 2026-08-28 (see frontier_env_v3.py); listed here for visibility, override
# only with a re-measured baseline.
# energy_reward:
#   energy_T_max_K: 330.396      # /9 baseline peak + 0.5 K
#   energy_P_ref_W: 1.709e5      # /9 baseline mean cooling power
#   energy_lambda_per_K: 10.0    # violation price per K per step
